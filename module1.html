<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<title>Chemistry Course Feedback Form</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 30px;
}
form {
    max-width: 700px;
    margin: auto;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #f9f9f9;
}
label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}
input[type="range"], input[type="text"], input[type="email"], select, textarea {
    width: 100%;
    margin-top: 5px;
}
textarea {
    height: 100px;
    resize: none;
}
.radio-group, .checkbox-group {
    margin-top: 10px;
}
.radio-group label, .checkbox-group label {
    font-weight: normal;
    margin-right: 15px;
}
button {
    margin-top: 20px;
    padding: 10px 20px;
    background: #007BFF;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
button:hover {
    background: #0056b3;
}
</style>
</head>
<body>
<h2>Chemistry Course Feedback Form</h2>
<form action="#" method="post">
    <!-- Student Info -->
    <label for="name">Your Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Your Email:</label>
    <input type="email" id="email" name="email" required>
    <label for="email">Your Email:</label>
<input type="email" id="email" name="email" required>

<!-- Course Rating -->
<label for="rating">Rate the Chemistry course (1 = Poor, 10 = Excellent):</label>
<input type="range" id="rating" name="rating" min="1" max="10" required>

<!-- Difficulty -->
<label>Course Difficulty (Chemistry concepts):</label>
<div class="radio-group">
  <label><input type="radio" name="difficulty" value="Easy" required> Easy</label>
  <label><input type="radio" name="difficulty" value="Moderate" required> Moderate</label>
  <label><input type="radio" name="difficulty" value="Hard" required> Hard</label>
</div>

<!-- Branch of Chemistry -->
<label for="branch">Which branch of Chemistry was most challenging?</label>
<select id="branch" name="branch" required>
  <option value="">--Select--</option>
  <option value="Organic">Organic Chemistry</option>
  <option value="Inorganic">Inorganic Chemistry</option>
  <option value="Physical">Physical Chemistry</option>
  <option value="Analytical">Analytical Chemistry</option>
  <option value="Biochemistry">Biochemistry</option>
</select>

<!-- Favorite Topic -->
<label for="favorite">Your Favorite Topic in Chemistry:</label>
<input type="text" id="favorite" name="favorite" placeholder="e.g., Chemical Bonding, Thermodynamics" required>

<!-- Lab Experience -->
<label for="lab">Rate your Lab/Practical experience (1 = Poor, 10 = Excellent):</label>
<input type="range" id="lab" name="lab" min="1" max="10" required>

<!-- Comments -->
<label for="comments">Your Comments on Chemistry course:</label>
<textarea id="comments" name="comments" placeholder="Share your thoughts on lectures, labs, experiments, or topics like organic/inorganic chemistry..." required></textarea>

<!-- Suggestions -->
<label for="suggestions">Suggestions for Improvement:</label>
<textarea id="suggestions" name="suggestions" placeholder="What could make this course better?" required></textarea>

<!-- Confirmation -->
<div class="checkbox-group">
  <label><input type="checkbox" name="confirm" required> I confirm that my feedback is honest and accurate.</label>
</div>

<!-- Submit -->
<button type="submit">Submit Feedback</button>
</form>
</body>
</html>
